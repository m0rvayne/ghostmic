[project]
name = "meeting-transcript-mcp"
version = "0.1.0"
description = "Live Zoom transcription via BlackHole + Whisper AI, served to Claude through MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "m0rvayne" }]

dependencies = [
    "mcp>=1.26.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/m0rvayne/meeting-transcript-mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
