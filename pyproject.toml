[project]
name = "meeting-transcript-mcp"
version = "0.1.0"
description = "Live Zoom transcription via BlackHole + Whisper AI, served to Claude Desktop through MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "m0rvayne" }]
keywords = ["mcp", "whisper", "zoom", "transcription", "meeting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "mcp>=1.26.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]

[project.urls]
Repository = "https://github.com/m0rvayne/meeting-transcript-mcp"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
