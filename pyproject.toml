[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmic"
version = "0.4.0"
description = "Silent meeting transcription for Claude. CoreAudio capture, whisper.cpp + LLM post-processing, MCP delivery."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "m0rvayne" }]

dependencies = [
    "mcp>=1.26.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
macos = [
    "sounddevice>=0.4.6",
    "mlx-lm>=0.20.0",
]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
ghostmic = "ghostmic:main"

[project.urls]
Repository = "https://github.com/m0rvayne/ghostmic"

[tool.setuptools]
packages = ["ghostmic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
