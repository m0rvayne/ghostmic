startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      whisperModel:
        type: string
        default: "small"
        description: "Whisper model size (tiny, base, small, medium, large-v3)"
      diarization:
        type: string
        default: "1"
        description: "Enable speaker labels ([You] vs [Remote]). Set to 0 to disable."
  commandFunction:
    |-
    (config) => ({
      command: 'python3',
      args: ['server.py'],
      env: {
        WHISPER_MODEL: config.whisperModel || 'small',
        DIARIZATION: config.diarization || '1'
      }
    })
