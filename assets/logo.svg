<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="ghostGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="ghostAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
    <filter id="ghostShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="12" fill="#0a0a0f"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14141f" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="220" rx="12" fill="url(#grid)" opacity="0.6"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="2" rx="1" fill="url(#ghostAccent)"/>

  <!-- Ghost icon (minimal) -->
  <g transform="translate(280, 30)" filter="url(#ghostShadow)" opacity="0.12">
    <path d="M120 10 C80 10 50 40 50 80 L50 130 L65 115 L80 130 L95 115 L110 130 L125 115 L140 130 L155 115 L170 130 L170 80 C170 40 140 10 120 10 Z M95 60 A8 8 0 1 1 95 76 A8 8 0 1 1 95 60 Z M135 60 A8 8 0 1 1 135 76 A8 8 0 1 1 135 60 Z" fill="#8b5cf6"/>
  </g>

  <!-- Main title -->
  <text x="400" y="105" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="76" font-weight="900" fill="url(#ghostGlow)" filter="url(#shadow)" letter-spacing="6">
    GHOSTMIC
  </text>

  <!-- Subtitle -->
  <text x="400" y="148" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#6b7280" letter-spacing="8">
    SILENT TRANSCRIPTION  ·  LOCAL AI  ·  NO BOT
  </text>

  <!-- Bottom info line -->
  <text x="400" y="190" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#374151" letter-spacing="3">
    by m0rvayne  ·  Whisper + MCP  ·  macOS
  </text>

  <!-- Corner decorations -->
  <path d="M 20 15 L 20 8 L 27 8" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <path d="M 780 15 L 780 8 L 773 8" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <path d="M 20 205 L 20 212 L 27 212" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <path d="M 780 205 L 780 212 L 773 212" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>

  <!-- Bottom accent line -->
  <rect x="0" y="218" width="800" height="2" rx="1" fill="url(#ghostAccent)"/>
</svg>
