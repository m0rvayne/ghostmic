name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests/test_server.py tests/test_capture.py tests/test_watcher.py -v

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest tests/test_integration.py -v

  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -framework CoreAudio -framework CoreFoundation create-multi-output.swift -o create-multi-output
      - run: ./create-multi-output list

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && bash -n setup-audio.sh && bash -n update.sh && bash -n uninstall.sh
